<!DOCTYPE html>
<html lang="vi" data-page="heatmap" class="auth-checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <title>Bản đồ nhiệt · ThảoChi Stock</title>
  <link rel="stylesheet" href="css/style.css?v=20261028">
</head>
<body class="hmpage">
  <header class="topbar">
    <h1 class="brand"><a href="dashboard.html">ThảoChi<span>Stock</span></a></h1>
    <span class="page-tag">Bản đồ nhiệt</span>
    <div class="status">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Đang tải…</span>
    </div>
    <div id="user-bar" class="user-bar"></div>
  </header>

  <div id="notice" class="notice" role="alert" hidden>
    <span id="notice-text"></span>
    <button id="notice-close" type="button" aria-label="Đóng thông báo">×</button>
  </div>

  <main class="hm">
    <div class="hm-bar">
      <h2 class="hm-title">Bản đồ nhiệt <span class="dim">— Market Watch</span></h2>
      <span id="hm-summary" class="hm-summary dim">Đang tải…</span>
      <div class="hm-controls">
        <label for="hm-scope" class="sr-only">Phạm vi</label>
        <select id="hm-scope" class="input hm-scope"></select>
        <div id="hm-period" class="seg" role="group" aria-label="Kỳ so sánh"></div>
        <button id="hm-reload" type="button" class="btn btn-sm">Tải lại</button>
      </div>
    </div>

    <div class="hm-wrap">
      <div id="hm-map" class="hm-map" aria-label="Bản đồ nhiệt theo ngành"></div>
      <div id="hm-tip" class="hm-tip" role="tooltip" hidden></div>
      <div id="hm-loading" class="loading">
        <div class="hm-progress">
          <span id="hm-progress-text">Đang tải dữ liệu…</span>
          <div class="bar"><i id="hm-progress-bar"></i></div>
        </div>
      </div>
    </div>

    <div id="hm-legend" class="hm-legend"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=20261028"></script>
  <script src="js/universe.js?v=20261028"></script>
  <script src="js/auth.js?v=20261028"></script>
  <script src="js/data.js?v=20261028"></script>
  <script src="js/priceboard.js?v=20261028"></script>
  <script src="js/heatmap.js?v=20261028"></script>
  <script src="js/heatmap-page.js?v=20261028"></script>
</body>
</html>
