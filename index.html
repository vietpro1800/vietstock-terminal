<!DOCTYPE html>
<html lang="vi" class="auth-checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <title>ThảoChi Stock</title>
  <link rel="stylesheet" href="css/style.css?v=20261104">
</head>
<body class="shell">
  <!-- Khung ứng dụng: thanh trên cùng cố định, các trang chức năng chạy trong iframe (js/shell.js). -->
  <header class="shell-bar">
    <h1 class="brand"><a href="#dashboard">ThảoChi<span>Stock</span></a></h1>
    <nav id="shell-nav" class="shell-nav" aria-label="Chức năng"></nav>
    <div id="shell-status" class="status shell-status" hidden>
      <span id="shell-status-dot" class="dot"></span>
      <span id="shell-status-text"></span>
    </div>
    <button id="shell-fx-btn" type="button" class="shell-fx-btn" aria-pressed="true" title="Hiệu ứng nhện: Bật">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.5" y="7" width="5" height="10" rx="1"/><path d="M9.5 9L6 6 2 7M9.5 11.5H5L2 12M9.5 13.5L5 16l-2 3M9.5 15.5L7 19l1 3M14.5 9L18 6l4 1M14.5 11.5H19l3 .5M14.5 13.5L19 16l2 3M14.5 15.5L17 19l-1 3"/></svg>
      <span class="sr-only">Hiệu ứng nhện</span>
    </button>
    <div id="shell-user" class="user-bar shell-user"></div>
  </header>

  <main id="shell-frames" class="shell-frames">
    <canvas id="shell-fx" class="shell-fx" aria-hidden="true"></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=20261104"></script>
  <script src="js/auth.js?v=20261104"></script>
  <script src="js/spider.js?v=20261104"></script>
  <script src="js/shell.js?v=20261104"></script>
</body>
</html>
