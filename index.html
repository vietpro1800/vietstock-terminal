<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <title>ThảoChi Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">ThảoChi<span>Stock</span></h1>
    <form id="symbol-form" class="symbol-form" autocomplete="off">
      <label for="symbol-input" class="sr-only">Mã chứng khoán</label>
      <input id="symbol-input" list="symbol-list" maxlength="10" placeholder="Nhập mã, ví dụ HPG"
             autocapitalize="characters" spellcheck="false" enterkeyhint="go">
      <datalist id="symbol-list"></datalist>
      <button type="submit">Xem</button>
    </form>
    <div class="status">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Đang tải…</span>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden>
    <span id="notice-text"></span>
    <button id="notice-close" type="button" aria-label="Đóng thông báo">×</button>
  </div>

  <main class="layout">
    <section class="panel chart-panel">
      <div class="chart-head">
        <h2 id="chart-title">—</h2>
        <div id="tf-group" class="seg" role="group" aria-label="Khung thời gian"></div>
      </div>
      <div id="ind-group" class="chips" role="group" aria-label="Chỉ báo">
        <label class="chip c-ma20"><input type="checkbox" data-ind="ma20">MA20</label>
        <label class="chip c-ma50"><input type="checkbox" data-ind="ma50">MA50</label>
        <label class="chip c-ma200"><input type="checkbox" data-ind="ma200">MA200</label>
        <label class="chip c-bb"><input type="checkbox" data-ind="bb">Bollinger</label>
        <label class="chip c-rsi"><input type="checkbox" data-ind="rsi">RSI</label>
        <label class="chip c-macd"><input type="checkbox" data-ind="macd">MACD</label>
      </div>
      <div id="legend" class="legend"></div>
      <div class="chart-wrap">
        <div id="chart-main" class="chart-main"></div>
        <div id="chart-loading" class="loading" hidden>Đang tải dữ liệu…</div>
      </div>
      <div class="subchart">
        <span class="subchart-label">RSI 14</span>
        <div id="chart-rsi" class="chart-sub"></div>
      </div>
      <div class="subchart">
        <span class="subchart-label">MACD 12, 26, 9</span>
        <div id="chart-macd" class="chart-sub"></div>
      </div>
    </section>

    <section class="panel board-panel">
      <div class="board-head">
        <h2>Bảng giá</h2>
        <span class="unit">Giá: nghìn đồng</span>
      </div>
      <div class="board-scroll">
        <table class="board">
          <thead>
            <tr><th>Mã</th><th class="num">Giá</th><th class="num">+/-</th><th class="num">%</th><th class="num">KL</th></tr>
          </thead>
          <tbody id="board-body">
            <tr><td colspan="5" class="dim center">Đang tải…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    Dữ liệu: VNDirect (dchart). Biểu đồ: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts</a>. Tự làm mới mỗi 30 giây. Chỉ mang tính tham khảo, không phải khuyến nghị đầu tư.
  </footer>

  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
