<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <title>Đặt lại mật khẩu · ThảoChi Stock</title>
  <link rel="stylesheet" href="css/style.css?v=20260929">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1 class="brand brand-lg">ThảoChi<span>Stock</span></h1>
      <p class="auth-sub">Đặt lại mật khẩu</p>

      <div id="msg" class="auth-msg" role="status" hidden></div>

      <section data-view="loading">
        <p class="auth-text center">Đang xác thực link…</p>
      </section>

      <section data-view="form" hidden>
        <form id="reset-form" class="auth-form" novalidate>
          <label>Mật khẩu mới <small>(ít nhất 8 ký tự)</small>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label>Nhập lại mật khẩu mới
            <input name="password2" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Lưu mật khẩu mới</button>
        </form>
      </section>

      <section data-view="invalid" hidden>
        <p class="auth-text">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
          Vui lòng yêu cầu gửi link mới.</p>
        <a class="btn btn-primary btn-block" href="login.html">Về trang đăng nhập</a>
      </section>

      <section data-view="done" hidden>
        <p class="auth-text">Đã đổi mật khẩu thành công.</p>
        <a class="btn btn-primary btn-block" href="login.html">Tiếp tục</a>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=20260929"></script>
  <script src="js/auth.js?v=20260929"></script>
  <script src="js/reset.js?v=20260929"></script>
</body>
</html>
