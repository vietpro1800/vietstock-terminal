<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <title>Đặt lại mật khẩu · ThảoChi Stock</title>
  <link rel="stylesheet" href="css/style.css?v=20261001">
</head>
<body>
  <!-- Bộ icon dùng chung (nét vẽ theo màu chữ) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="gs-light"/>
        <stop offset="0.55" class="gs-mid"/>
        <stop offset="1" class="gs-dark"/>
      </linearGradient>
    </defs>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"/><path d="M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  </svg>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <!-- Biểu tượng ThảoChi Stock: nến tăng dần + đường đi lên -->
        <svg class="auth-emblem" viewBox="0 0 64 64" aria-hidden="true">
          <g fill="url(#gold-grad)" stroke="url(#gold-grad)" stroke-width="1.6" stroke-linecap="round">
            <line x1="17.5" y1="34" x2="17.5" y2="54"/>
            <rect x="14" y="38" width="7" height="12" rx="1.2" stroke="none"/>
            <line x1="31.5" y1="24" x2="31.5" y2="50"/>
            <rect x="28" y="28" width="7" height="17" rx="1.2" stroke="none"/>
            <line x1="45.5" y1="12" x2="45.5" y2="44"/>
            <rect x="42" y="16" width="7" height="22" rx="1.2" stroke="none"/>
          </g>
          <path d="M6 56 C 22 52, 38 40, 56 10" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
          <path d="M49 10.5 L56.5 9 L55.5 16.5" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 class="brand brand-lg">ThảoChi<span>Stock</span></h1>
      </div>
      <p class="auth-sub">Đặt lại mật khẩu</p>

      <div id="msg" class="auth-msg" role="status" hidden></div>

      <section data-view="loading">
        <p class="auth-text center">Đang xác thực link…</p>
      </section>

      <section data-view="form" hidden>
        <form id="reset-form" class="auth-form" novalidate>
          <label class="field">
            <span class="sr-only">Mật khẩu mới (ít nhất 8 ký tự)</span>
            <svg class="field-icon" aria-hidden="true"><use href="#i-lock"/></svg>
            <input name="password" type="password" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span class="sr-only">Nhập lại mật khẩu mới</span>
            <svg class="field-icon" aria-hidden="true"><use href="#i-lock"/></svg>
            <input name="password2" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" minlength="8" required>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Lưu mật khẩu mới</button>
        </form>
      </section>

      <section data-view="invalid" hidden>
        <p class="auth-text">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
          Vui lòng yêu cầu gửi link mới.</p>
        <a class="btn btn-primary btn-block" href="login.html">Về trang đăng nhập</a>
      </section>

      <section data-view="done" hidden>
        <p class="auth-text">Đã đổi mật khẩu thành công.</p>
        <a class="btn btn-primary btn-block" href="login.html">Tiếp tục</a>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=20261001"></script>
  <script src="js/auth.js?v=20261001"></script>
  <script src="js/reset.js?v=20261001"></script>
</body>
</html>
